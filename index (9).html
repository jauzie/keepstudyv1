/* ============================ ROUTER ============================ */
const Views = {};
let ROUTES = [];
const go = (p) => { if (location.hash === '#' + p) render(); else location.hash = '#' + p; };
const replaceRoute = (p) => { history.replaceState(null, '', '#' + p); render(); };
const onLeave = (fn) => S.leave.push(fn);

function matchRoute(path) {
  const parts = path.split('/').filter(Boolean);
  for (const r of ROUTES) {
    const rp = r.path.split('/').filter(Boolean);
    if (rp.length !== parts.length) continue;
    const params = {}; let ok = true;
    rp.forEach((seg, i) => { if (seg.startsWith(':')) params[seg.slice(1)] = decodeURIComponent(parts[i]); else if (seg !== parts[i]) ok = false; });
    if (ok) return { route: r, params };
  }
  return null;
}

function teardown() {
  for (const fn of S.leave.splice(0)) { try { fn(); } catch (_) {} }
  try { S.view?.destroy?.(); } catch (_) {}
  document.querySelectorAll('.modal-root').forEach((m) => m.remove());
  Charts.gc();
}

async function render() {
  const raw = location.hash.slice(1);
  if (/access_token=|error_description=|type=recovery|code=/.test(raw)) return;
  const [path, qs = ''] = (raw || '/').split('?');
  const query = Object.fromEntries(new URLSearchParams(qs));
  teardown();
  S.view = null;

  if (!S.session) {
    const authView = { '/login': 'login', '/register': 'register', '/forgot': 'forgot' }[path];
    if (!authView) return replaceRoute('/login');
    return renderAuth(authView);
  }
  if (S.recovery || path === '/reset') return renderAuth('reset');
  if (!S.profile) return renderFatal('Profil tidak ditemukan', 'Akun Anda tidak memiliki profil di database. Pastikan skema SQL Keepstudy sudah dijalankan sebelum mendaftar, lalu hubungi administrator.', true);
  if (S.profile.status !== 'ACTIVE') return Views.pending.render();

  const role = isAdmin() ? 'admin' : 'student';
  const m = matchRoute(path);
  if (!m || (m.route.role !== 'any' && m.route.role !== role)) return replaceRoute(role === 'admin' ? '/admin' : '/dashboard');
  const view = Views[m.route.view];
  S.ctx = { path, params: m.params, query, route: m.route, refresh: false };
  S.view = view;

  if (m.route.layout === 'exam') {
    S.viewEl = $('#app'); $('#app').innerHTML = '';
    return safeRender(view, S.viewEl, S.ctx);
  }
  ensureShell();
  updateShell(m.route);
  const el = document.createElement('div');
  el.className = 'content'; el.id = 'view';
  $('#view').replaceWith(el); S.viewEl = el;
  window.scrollTo({ top: 0 });
  await safeRender(view, el, S.ctx);
}

async function safeRender(view, el, ctx) {
  try { await view.render(el, ctx); }
  catch (e) {
    console.error(e);
    if (el.isConnected) el.innerHTML = `<div class="card">${emptyState('alert', 'Gagal memuat halaman', errMsg(e), `<button class="btn btn-primary" onclick="render()">${icon('refresh')}Coba lagi</button>`)}</div>`;
  }
}

async function refreshView() {
  if (!S.view || !S.viewEl?.isConnected || S.view.noRefresh) return;
  if (document.querySelector('.modal-root')) { S.refreshQueued = true; return; }
  const ae = document.activeElement, id = ae?.id, sel = ae && 'selectionStart' in ae ? [ae.selectionStart, ae.selectionEnd] : null;
  const y = window.scrollY;
  S.ctx.refresh = true;
  await safeRender(S.view, S.viewEl, S.ctx);
  S.ctx.refresh = false;
  window.scrollTo({ top: y });
  if (id) { const n = document.getElementById(id); if (n) { n.focus(); if (sel) try { n.setSelectionRange(...sel); } catch (_) {} } }
}
setInterval(() => { if (S.refreshQueued && !document.querySelector('.modal-root')) { S.refreshQueued = false; refreshView(); } }, 1500);

/* ============================ REALTIME ============================ */
const RT_TABLES = ['profiles', 'materials', 'material_progress', 'tryouts', 'attempts', 'ptn_programs', 'app_settings', 'questions'];
const rtChanged = new Set();
const flushRt = debounce(async () => {
  const changed = [...rtChanged]; rtChanged.clear();
  if (changed.includes('app_settings')) { try { await loadSettings(); } catch (_) {} }
  if (changed.includes('profiles')) updateBadges();
  const deps = S.ctx?.route?.deps || [];
  if (deps.some((d) => changed.includes(d))) refreshView();
}, 700);

function startRealtime() {
  stopRealtime();
  if (!S.sb || !S.user) return;
  const ch = S.sb.channel('keepstudy-' + S.user.id);
  RT_TABLES.forEach((t) => ch.on('postgres_changes', { event: '*', schema: 'public', table: t }, (p) => onDbChange(t, p)));
  ch.subscribe((status) => { S.rt = status === 'SUBSCRIBED'; updateRtDot(); });
  S.channel = ch;
}
function stopRealtime() { if (S.channel) { try { S.sb.removeChannel(S.channel); } catch (_) {} S.channel = null; S.rt = false; } }

async function onDbChange(table, payload) {
  if (table === 'profiles' && (payload.new?.id || payload.old?.id) === S.user?.id) {
    const before = S.profile?.status;
    if (payload.eventType === 'DELETE') { toast('warn', 'Akun dihapus', 'Akun Anda telah dihapus oleh administrator.'); return logout(true); }
    S.profile = { ...S.profile, ...payload.new };
    updateMe();
    if (before !== S.profile.status) {
      if (S.profile.status === 'ACTIVE') { toast('success', 'Akun diaktifkan! 🎉', 'Selamat datang di Keepstudy. Selamat belajar!'); $('#app').innerHTML = ''; return replaceRoute(isAdmin() ? '/admin' : '/dashboard'); }
      toast('warn', 'Status akun berubah', `Status akun Anda kini ${S.profile.status}.`);
      $('#app').innerHTML = ''; return render();
    }
  }
  rtChanged.add(table); flushRt();
}

async function setSession(session) {
  const prevUser = S.user?.id;
  S.session = session; S.user = session?.user || null;
  if (!S.user) { S.profile = null; stopRealtime(); return; }
  if (prevUser !== S.user.id || !S.profile) {
    await Promise.all([loadProfile(), loadSettings(), loadSubjects().catch(() => (S.subjects = []))]);
    startRealtime();
  }
}
async function logout(silent) {
  stopRealtime();
  try { await S.sb.auth.signOut(); } catch (_) {}
  S.session = S.user = S.profile = null; S.recovery = false;
  $('#app').innerHTML = '';
  if (!silent) toast('info', 'Anda telah keluar', 'Sampai jumpa lagi!');

}

function bindPwToggles(root) {
  $$('.toggle-pw', root).forEach((b) => (b.onclick = () => {
    const inp = b.parentElement.querySelector('input'); const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password'; b.innerHTML = icon(show ? 'eyeOff' : 'eye');
  }));
  const pw = root.querySelector('input[name="password"]'), bar = root.querySelector('.pw-meter i');
  if (pw && bar) pw.addEventListener('input', () => {
    const v = pw.value; let s = 0;
    if (v.length >= 8) s++; if (/[A-Z]/.test(v) && /[a-z]/.test(v)) s++; if (/\d/.test(v)) s++; if (/[^\w]/.test(v) || v.length >= 12) s++;
    bar.style.width = (s / 4) * 100 + '%'; bar.style.background = ['#DC2626', '#F59E0B', '#EAB308', '#22C55E', '#16A34A'][s];
  });
}

const AuthActions = {
  async login(form, btn) {
    const d = validate(form, { email: V.email, password: V.req('Password') }); if (!d) return;
    setBusy(btn, true);
    try {
      const { data, error } = await S.sb.auth.signInWithPassword({ email: d.email, password: d.password });
      if (error) throw error;
      await setSession(data.session);
      toast('success', 'Berhasil masuk', `Halo, ${firstName(S.profile?.full_name)}!`);
      $('#app').innerHTML = ''; replaceRoute(isAdmin() ? '/admin' : '/dashboard');
    } catch (e) { toast('error', 'Gagal masuk', errMsg(e)); setBusy(btn, false); }
  },
  async register(form, btn, card) {
    const d = validate(form, {
      full_name: V.len('Nama lengkap', 3, 120), email: V.email, whatsapp: V.wa, school: V.len('Asal sekolah', 3, 150),
      password: V.pw, confirm: (v, all) => (!v ? 'Konfirmasi password wajib diisi' : v !== all.password ? 'Konfirmasi password tidak sama' : ''),
      agree: (v) => (v ? '' : 'Anda perlu menyetujui pengelolaan data'),
    }); if (!d) return;
    setBusy(btn, true);
    try {
      const { data, error } = await S.sb.auth.signUp({
        email: d.email, password: d.password,
        options: { emailRedirectTo: appBase(), data: { full_name: d.full_name, whatsapp: d.whatsapp.replace(/[\s-]/g, ''), school: d.school } },
      });
      if (error) throw error;
      if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) throw new Error('User already registered');
      if (data.session) { await setSession(data.session); $('#app').innerHTML = ''; return render(); }
      card.innerHTML = doneCard('mail', 'Registrasi berhasil!', `Kami mengirim email verifikasi ke <b>${esc(d.email)}</b>. Setelah email diverifikasi, akun Anda akan menunggu persetujuan administrator.`,

    const d = validate(form, { email: V.email }); if (!d) return;

    const d = validate(form, { password: V.pw, confirm: (v, all) => (v !== all.password ? 'Konfirmasi password tidak sama' : '') }); if (!d) return;
    setBusy(btn, true);

  },
};

db.all = async (make, page = 1000) => {

    if (rows.length < page) break;

};

/* Statistik per siswa dari daftar pengerjaan */
function perStudent(atts) {
  const by = groupBy(submitted(atts), 'user_id'), out = {};
  for (const [uid, list] of Object.entries(by)) {
    const s = [...list].sort((a, b) => new Date(a.submitted_at) - new Date(b.submitted_at));
    const subj = {};
    s.forEach((a) => Object.entries(a.subject_scores || {}).forEach(([c, v]) => (subj[c] ||= []).push(Number(v.percent))));
    out[uid] = {
      n: s.length, avg: avg(s.map((a) => a.percent)), best: Math.max(...s.map((a) => Number(a.percent))),
      first: Number(s[0].percent), last: Number(s.at(-1).percent), prev: s.length > 1 ? Number(s.at(-2).percent) : null, list: s,
      subj: Object.fromEntries(Object.entries(subj).map(([c, v]) => [c, avg(v)])), lastAt: s.at(-1).submitted_at,
    };
  }
  return out;
}
function subjectAverages(atts) {
  const acc = {};
  submitted(atts).forEach((a) => Object.entries(a.subject_scores || {}).forEach(([c, v]) => (acc[c] ||= []).push(Number(v.percent))));
  return S.subjects.map((s) => ({ code: s.code, name: s.name, color: s.color, avg: acc[s.code] ? avg(acc[s.code]) : null, n: acc[s.code]?.length || 0 }));
}
function weekBuckets(n = 10) {
  const now = new Date(); const d = new Date(now); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return Array.from({ length: n }, (_, i) => { const s = new Date(d); s.setDate(s.getDate() - (n - 1 - i) * 7); const e = new Date(s); e.setDate(e.getDate() + 7); return { s, e, label: s.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }) }; });
}
function dayBuckets(n = 14) {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  return Array.from({ length: n }, (_, i) => { const s = new Date(d); s.setDate(s.getDate() - (n - 1 - i)); const e = new Date(s); e.setDate(e.getDate() + 1); return { s, e, label: s.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }) }; });
}
const inB = (v, b) => { const t = new Date(v); return t >= b.s && t < b.e; };
const DIST_BUCKETS = [['0–20', 0, 20], ['20–40', 20, 40], ['40–60', 40, 60], ['60–80', 60, 80], ['80–100', 80, 101]];
const DIST_COLORS = ['#DC2626', '#F59E0B', '#EAB308', '#22C55E', '#16A34A'];

/* ============================ AKSI SISWA (dipakai beberapa halaman) ============================ */
const StudentActions = {
  async setStatus(p, status) {
    const labels = { ACTIVE: 'Aktifkan', REJECTED: 'Tolak', SUSPENDED: 'Nonaktifkan', PENDING: 'Kembalikan ke menunggu' };
    if (status === 'ACTIVE') {
      await db.q(db.from('profiles').update({ status }).eq('id', p.id));
      toast('success', 'Akun diaktifkan', `${p.full_name} kini dapat mengakses dashboard.`);
      return true;
    }
    return new Promise((resolve) => {
      let ok = false;
      const m = modal({
        title: `${labels[status]} akun?`, sub: `${esc(p.full_name)} · ${esc(p.email)}`,
        headIcon: `<div class="confirm-ico ${status === 'SUSPENDED' ? 'amber' : ''}">${icon(status === 'SUSPENDED' ? 'lock' : 'ban')}</div>`,
        body: `<p class="muted small mb">${status === 'REJECTED' ? 'Siswa tidak akan dapat mengakses fitur apa pun. Status dapat diubah kembali kapan saja.' : 'Siswa langsung kehilangan akses ke materi dan Try Out. Data dan riwayat tetap tersimpan.'}</p>
          ${F.area('note', 'Catatan untuk siswa (opsional)', p.admin_note || '', { rows: 3, ph: 'Contoh: Data sekolah tidak valid, silakan hubungi admin.' })}`,
        actions: [{ label: 'Batal' }, {
          label: labels[status], cls: status === 'SUSPENDED' ? 'btn-primary' : 'btn-danger',
          onClick: async ({ root }) => {
            await db.q(db.from('profiles').update({ status, admin_note: root.querySelector('[name=note]').value.trim() }).eq('id', p.id));
            ok = true; toast('success', 'Status diperbarui', `${p.full_name}: ${status}`);
          },
        }],
      });
      const obs = new MutationObserver(() => { if (!document.body.contains(m.root)) { obs.disconnect(); resolve(ok); } });
      obs.observe(document.body, { childList: true });
    });
  },
  edit(p) {
    modal({
      title: 'Edit data siswa', sub: esc(p.email), size: 'wide',
      body: `<form id="stEdit" novalidate><div class="grid-2">
        ${F.text('full_name', 'Nama lengkap', p.full_name, { attrs: 'maxlength="120"' })}${F.text('whatsapp', 'Nomor WhatsApp', p.whatsapp, { attrs: 'maxlength="20"' })}
        ${F.text('school', 'Asal sekolah', p.school, { attrs: 'maxlength="150"' })}
        ${F.select('plan', 'Paket akses', [['FREE', 'Free — materi gratis'], ['PREMIUM', 'Premium — semua materi & TO premium']], p.plan)}
        ${F.select('status', 'Status akun', [['PENDING', 'PENDING — menunggu'], ['ACTIVE', 'ACTIVE — aktif'], ['REJECTED', 'REJECTED — ditolak'], ['SUSPENDED', 'SUSPENDED — nonaktif']], p.status)}
        </div>${F.area('admin_note', 'Catatan admin (terlihat oleh siswa bila ditolak/nonaktif)', p.admin_note, { rows: 3 })}</form>`,
      actions: [{ label: 'Batal' }, {
        label: 'Simpan perubahan', cls: 'btn-primary', icon: 'check',
        onClick: async ({ root }) => {
          const d = validate($('#stEdit', root), { full_name: V.len('Nama', 3, 120), whatsapp: V.wa, school: V.len('Sekolah', 2, 150) });
          if (!d) return false;
          d.whatsapp = d.whatsapp.replace(/[\s-]/g, '');
          await db.q(db.from('profiles').update(d).eq('id', p.id));
          toast('success', 'Data siswa disimpan'); refreshView();
        },
      }],
    });
  },
  async remove(p, after) {
    const ok = await confirmDialog({ title: 'Hapus akun siswa permanen?', message: `Akun <b>${esc(p.full_name)}</b> beserta seluruh riwayat belajar dan hasil Try Out akan dihapus permanen sesuai kebijakan pengelolaan data. Tindakan ini tidak dapat dibatalkan.`, confirmText: 'Hapus permanen', ic: 'trash' });
    if (!ok) return;
    try { await db.rpc('admin_delete_user', { p_user: p.id }); toast('success', 'Akun dihapus', p.full_name); after ? after() : refreshView(); }
    catch (e) { toast('error', 'Gagal menghapus', errMsg(e)); }
  },
};
const waLink = (n) => { const d = String(n || '').replace(/\D/g, '').replace(/^0/, '62'); return d ? `https://wa.me/${d}` : '#'; };
const personCell = (p, sub = p.email) => `<div class="person"><div class="avatar">${esc(initials(p.full_name))}</div><div style="min-width:0"><b>${esc(p.full_name || '(tanpa nama)')}</b><span>${esc(sub)}</span></div></div>`;

/* ============================ ADMIN: DASHBOARD ============================ */
Views.adminDashboard = {
  async render(el, ctx) {
    if (!ctx.refresh) el.innerHTML = skeleton(2);
    const [students, atts, materials, tryouts, progress] = await Promise.all([AD.students(), AD.attempts(), AD.materials(), AD.tryouts(), AD.progress()]);
    const sub = submitted(atts), cnt = (s) => students.filter((p) => p.status === s).length;
    const ps = perStudent(atts), avgAll = avg(sub.map((a) => a.percent));
    const pending = students.filter((p) => p.status === 'PENDING').slice(0, 5);
    const stat = (ic, cls, val, lbl, delta = '') => `<div class="card stat card-hover"><div class="ico ${cls}">${icon(ic)}</div><div class="val">${val}</div><div class="lbl">${lbl}</div>${delta ? `<div class="delta">${delta}</div>` : ''}</div>`;
    const newThisWeek = students.filter((p) => Date.now() - new Date(p.created_at) < 7 * 864e5).length;
    el.innerHTML = `
      <div class="card hero-card mb"><div class="row between"><div><h2>Halo, ${esc(firstName(S.profile.full_name))} 👋</h2><p class="mt-sm">${S.pendingCount ? `Ada <b>${S.pendingCount} pendaftar</b> menunggu aktivasi.` : 'Semua pendaftar sudah ditinjau. Kerja bagus!'} Data diperbarui otomatis secara realtime.</p></div>
        <div class="row"><a class="btn btn-outline" href="#/admin/activation">${icon('userCheck')}Tinjau aktivasi</a><a class="btn btn-outline" href="#/admin/tryouts">${icon('plus')}Try Out baru</a></div></div></div>
      <div class="grid cols-4 keep">
        ${stat('users', '', fmt.num(students.length), 'Total siswa terdaftar', `+${newThisWeek} dalam 7 hari terakhir`)}
        ${stat('userCheck', '', fmt.num(cnt('ACTIVE')), 'Siswa aktif', `${fmt.pct(students.length ? (cnt('ACTIVE') / students.length) * 100 : 0, 0)} dari total`)}
        ${stat('hourglass', 'amber', fmt.num(cnt('PENDING')), 'Menunggu aktivasi', `<a href="#/admin/activation">Tinjau sekarang →</a>`)}
        ${stat('lock', 'red', fmt.num(cnt('SUSPENDED')), 'Siswa nonaktif', `${cnt('REJECTED')} pendaftaran ditolak`)}
        ${stat('book', 'blue', fmt.num(materials.length), 'Total materi', `${materials.filter((m) => m.is_published).length} terbit · ${materials.filter((m) => m.is_premium).length} premium`)}
        ${stat('layers', 'violet', fmt.num(tryouts.length), 'Total Try Out', `${tryouts.filter((t) => t.is_published).length} dipublikasikan`)}
        ${stat('clipboard', 'blue', fmt.num(sub.length), 'Total pengerjaan TO', `${atts.filter((a) => a.status === 'IN_PROGRESS').length} sedang berlangsung`)}
        ${stat('target', '', fmt.pct(avgAll), 'Rata-rata nilai siswa', 'Persentase skor dari skala TO')}
      </div>
      <div class="grid cols-2 mt">
        <div class="card"><div class="card-head"><div><h3>Pertumbuhan jumlah siswa</h3><p>Akumulasi pendaftar per minggu</p></div></div><div id="chGrowth"></div></div>
        <div class="card"><div class="card-head"><div><h3>Aktivitas siswa</h3><p>14 hari terakhir</p></div></div><div id="chAct"></div></div>
        <div class="card"><div class="card-head"><div><h3>Rata-rata nilai Try Out</h3><p>Persentase skor per paket</p></div></div><div id="chTo"></div></div>
        <div class="card"><div class="card-head"><div><h3>Distribusi kemampuan siswa</h3><p>Berdasarkan rata-rata skor seluruh TO</p></div></div><div id="chDist"></div></div>
      </div>
      <div class="grid cols-2 mt">
        <div class="card"><div class="card-head"><h3>Pendaftar terbaru</h3><a href="#/admin/activation" class="small bold">Lihat semua</a></div>
          ${pending.length ? pending.map((p) => `<div class="list-item">${personCell(p, `${p.school || '–'} · ${fmt.rel(p.created_at)}`)}<div style="margin-left:auto" class="row"><button class="btn btn-primary btn-sm" data-approve="${p.id}">${icon('check')}Aktifkan</button></div></div>`).join('') : emptyState('userCheck', 'Tidak ada antrean', 'Semua pendaftar sudah diproses.')}</div>
        <div class="card"><div class="card-head"><h3>Pengerjaan terbaru</h3><a href="#/admin/results" class="small bold">Hasil lengkap</a></div>
          ${sub.length ? [...sub].sort((a, b) => new Date(b.submitted_at) - new Date(a.submitted_at)).slice(0, 6).map((a) => { const p = students.find((x) => x.id === a.user_id); const t = tryouts.find((x) => x.id === a.tryout_id); return `<div class="list-item"><div class="li-ico">${icon('clipboard')}</div><div class="li-body"><b>${esc(p?.full_name || 'Siswa')}</b><span>${esc(t?.title || 'Try Out')} · ${fmt.rel(a.submitted_at)}</span></div><b>${fmt.num(a.score, 0)}</b><span class="badge ${a.percent >= 70 ? '' : a.percent >= 50 ? 'amber' : 'red'}">${fmt.pct(a.percent, 0)}</span></div>`; }).join('') : emptyState('clipboard', 'Belum ada pengerjaan', 'Hasil TO siswa akan muncul di sini.')}</div>
      </div>`;
    const wk = weekBuckets(10);
    Charts.line($('#chGrowth', el), { labels: wk.map((b) => b.label), series: [{ name: 'Total siswa', data: wk.map((b) => students.filter((p) => new Date(p.created_at) < b.e).length) }] });
    const dy = dayBuckets(14);
    Charts.line($('#chAct', el), { labels: dy.map((b) => b.label), area: false, series: [
      { name: 'TO dikerjakan', data: dy.map((b) => atts.filter((a) => inB(a.started_at, b)).length), color: '#16A34A' },
      { name: 'Materi diselesaikan', data: dy.map((b) => progress.filter((p) => p.completed && p.completed_at && inB(p.completed_at, b)).length), color: '#0EA5E9' },
      { name: 'Materi dibuka', data: dy.map((b) => progress.filter((p) => inB(p.last_opened_at, b)).length), color: '#F59E0B' }] });
    const toAvg = tryouts.map((t) => ({ t, v: avg(sub.filter((a) => a.tryout_id === t.id).map((a) => a.percent)) })).filter((x) => x.v != null).slice(0, 10).reverse();
    Charts.bar($('#chTo', el), { labels: toAvg.map((x) => x.t.title), data: toAvg.map((x) => x.v), suffix: '%', max: 100, colors: '#22C55E', rotate: toAvg.length > 5 });
    const vals = Object.values(ps).map((s) => s.avg);
    Charts.bar($('#chDist', el), { labels: DIST_BUCKETS.map((b) => b[0] + '%'), data: DIST_BUCKETS.map(([, a, b]) => vals.filter((v) => v >= a && v < b).length), colors: DIST_COLORS, suffix: ' siswa', decimals: 0 });
    $$('[data-approve]', el).forEach((b) => (b.onclick = async () => { setBusy(b, true); try { await StudentActions.setStatus(students.find((p) => p.id === b.dataset.approve), 'ACTIVE'); } catch (e) { toast('error', 'Gagal', errMsg(e)); setBusy(b, false); } }));
  },
};

/* ============================ ADMIN: MANAJEMEN SISWA ============================ */
const stState = { q: '', status: '', school: '', plan: '' };
Views.adminStudents = {
  async render(el, ctx) {
    if (!ctx.refresh) el.innerHTML = skeleton(1);
    const [students, atts] = await Promise.all([AD.students(), AD.attempts('user_id,status,percent,submitted_at,subject_scores')]);
    const ps = perStudent(atts);
    const schools = uniq(students.map((p) => p.school).filter(Boolean)).sort();
    if (ctx.query.status && !ctx.refresh) stState.status = ctx.query.status;
    el.innerHTML = `<div class="card">
      <div class="toolbar">
        <div class="input-wrap grow">${icon('search')}<input class="input" id="stQ" placeholder="Cari nama atau email…" value="${esc(stState.q)}" style="width:100%"></div>
        <select class="input" id="stStatus">${[['', 'Semua status'], ['PENDING', 'Menunggu'], ['ACTIVE', 'Aktif'], ['SUSPENDED', 'Nonaktif'], ['REJECTED', 'Ditolak']].map(([v, l]) => `<option value="${v}" ${stState.status === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <select class="input" id="stSchool"><option value="">Semua sekolah</option>${schools.map((s) => `<option ${stState.school === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
        <select class="input" id="stPlan">${[['', 'Semua paket'], ['FREE', 'Free'], ['PREMIUM', 'Premium']].map(([v, l]) => `<option value="${v}" ${stState.plan === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
        <button class="btn btn-outline" id="stExport">${icon('download')}Export CSV</button>
      </div>
      <div id="stTable"></div></div>`;
    const filtered = () => students.filter((p) => {
      const q = stState.q.toLowerCase();
      return (!q || p.full_name.toLowerCase().includes(q) || p.email.toLowerCase().includes(q)) && (!stState.status || p.status === stState.status) && (!stState.school || p.school === stState.school) && (!stState.plan || p.plan === stState.plan);
    });
    const draw = () => {
      const rows = filtered();
      $('#stTable', el).innerHTML = rows.length ? `<div class="small muted mb">Menampilkan ${rows.length} dari ${students.length} siswa</div><div class="table-wrap"><table class="table"><thead><tr><th>Siswa</th><th class="hide-sm">WhatsApp</th><th>Sekolah</th><th>Status</th><th class="hide-sm">Paket</th><th class="num">TO</th><th class="num">Rata-rata</th><th class="hide-sm">Terdaftar</th><th></th></tr></thead><tbody>
        ${rows.map((p) => { const s = ps[p.id]; return `<tr>
          <td><a href="#/admin/students/${p.id}" style="color:inherit;text-decoration:none">${personCell(p)}</a></td>
          <td class="hide-sm"><a href="${waLink(p.whatsapp)}" target="_blank" rel="noopener">${esc(p.whatsapp || '–')}</a></td>
          <td>${esc(p.school || '–')}</td><td>${statusBadge(p.status)}</td><td class="hide-sm">${planBadge(p.plan)}</td>
          <td class="num">${s?.n || 0}</td><td class="num"><b>${fmt.pct(s?.avg)}</b></td><td class="hide-sm small muted">${fmt.date(p.created_at)}</td>
          <td><div class="actions">
            <a class="btn btn-ghost btn-icon btn-sm" href="#/admin/students/${p.id}" title="Lihat profil">${icon('eye')}</a>
            ${p.status === 'ACTIVE' ? `<button class="btn btn-ghost btn-icon btn-sm" data-act="suspend" data-id="${p.id}" title="Nonaktifkan">${icon('lock')}</button>` : `<button class="btn btn-ghost btn-icon btn-sm" data-act="activate" data-id="${p.id}" title="Aktifkan">${icon('unlock')}</button>`}
            <button class="btn btn-ghost btn-icon btn-sm" data-act="edit" data-id="${p.id}" title="Edit">${icon('edit')}</button>
            <button class="btn btn-ghost btn-icon btn-sm" data-act="delete" data-id="${p.id}" title="Hapus" style="color:var(--danger)">${icon('trash')}</button>
          </div></td></tr>`; }).join('')}</tbody></table></div>` : emptyState('search', 'Tidak ada siswa', 'Ubah kata kunci atau filter pencarian.');
      $$('[data-act]', el).forEach((b) => (b.onclick = async () => {
        const p = students.find((x) => x.id === b.dataset.id);
        try {
          if (b.dataset.act === 'activate') { setBusy(b, true); await StudentActions.setStatus(p, 'ACTIVE'); }
          if (b.dataset.act === 'suspend') await StudentActions.setStatus(p, 'SUSPENDED');
          if (b.dataset.act === 'edit') StudentActions.edit(p);
          if (b.dataset.act === 'delete') StudentActions.remove(p);
        } catch (e) { toast('error', 'Gagal', errMsg(e)); setBusy(b, false); }
      }));
    };
    draw();
    $('#stQ', el).oninput = debounce((e) => { stState.q = e.target.value; draw(); }, 150);
    $('#stStatus', el).onchange = (e) => { stState.status = e.target.value; draw(); };
    $('#stSchool', el).onchange = (e) => { stState.school = e.target.value; draw(); };
    $('#stPlan', el).onchange = (e) => { stState.plan = e.target.value; draw(); };
    $('#stExport', el).onclick = () => CSV.download(`keepstudy-siswa-${new Date().toISOString().slice(0, 10)}.csv`, CSV.stringify(filtered().map((p) => ({ ...p, jumlah_to: ps[p.id]?.n || 0, rata_rata: ps[p.id]?.avg?.toFixed(2) ?? '' })), ['full_name', 'email', 'whatsapp', 'school', 'status', 'plan', 'created_at', 'jumlah_to', 'rata_rata']));
  },
};

const matState = { subject: '', q: '' };
Views.adminMaterials = {
  async render(el, ctx) {

        <button class="chip ${!matState.subject ? 'active' : ''}" data-s="">Semua (${mats.length})</button>
        ${S.subjects.map((s) => `<button class="chip ${String(matState.subject) === String(s.id) ? 'active' : ''}" data-s="${s.id}">${esc(s.code)} (${mats.filter((m) => m.subject_id === s.id).length})</button>`).join('')}</div>
        <button class="btn btn-primary" id="addMat">${icon('plus')}Tambah materi</button></div>
      <div class="card"><div class="toolbar"><div class="input-wrap grow">${icon('search')}<input class="input" id="matQ" placeholder="Cari judul materi…" value="${esc(matState.q)}" style="width:100%"></div>
        <span class="small muted">${activeCount} siswa aktif · progres dihitung dari siswa yang menandai selesai</span></div><div id="matList"></div></div>`;
    const draw = () => {
      const rows = sorted.filter((m) => (!matState.subject || String(m.subject_id) === String(matState.subject)) && (!matState.q || m.title.toLowerCase().includes(matState.q.toLowerCase())));
      $('#matList', el).innerHTML = rows.length ? `<div class="table-wrap"><table class="table"><thead><tr><th style="width:90px">Urutan</th><th>Materi</th><th class="hide-sm">Subtes</th><th>Akses</th><th style="min-width:160px">Penyelesaian</th><th class="hide-sm">Diperbarui</th><th></th></tr></thead><tbody>
        ${rows.map((m) => { const d = doneBy[m.id]?.length || 0, pct = activeCount ? (d / activeCount) * 100 : 0, s = subjectById(m.subject_id); return `<tr>
          <td><div class="row" style="gap:4px"><b style="width:24px">${m.sort_order}</b><button class="btn btn-ghost btn-icon btn-sm" data-mv="-1" data-id="${m.id}" title="Naikkan">${icon('up')}</button><button class="btn btn-ghost btn-icon btn-sm" data-mv="1" data-id="${m.id}" title="Turunkan">${icon('down')}</button></div></td>
          <td><b>${esc(m.title)}</b><div class="row mt-sm" style="gap:6px">${!m.is_published ? '<span class="badge gray">Draft</span>' : ''}${m.video_url ? `<span class="badge blue">${icon('video')}Video</span>` : ''}${m.file_url ? `<span class="badge violet">${icon('file')}Modul</span>` : ''}${m.content ? '<span class="badge gray">Teks</span>' : ''}</div></td>
          <td class="hide-sm">${s ? `<span class="badge" style="background:${s.color}1a;color:${s.color}">${esc(s.code)}</span>` : '–'}</td>
          <td>${m.is_premium ? '<span class="badge violet">★ Premium</span>' : '<span class="badge">Gratis</span>'}</td>
          <td><div class="small"><b>${d}</b> selesai · ${openBy[m.id]?.length || 0} dibuka</div>${progressBar(pct)}</td>
          <td class="hide-sm small muted">${fmt.rel(m.updated_at)}</td>
          <td><div class="actions"><a class="btn btn-ghost btn-icon btn-sm" href="#/material/${m.id}" title="Pratinjau">${icon('eye')}</a><button class="btn btn-ghost btn-icon btn-sm" data-edit="${m.id}" title="Edit">${icon('edit')}</button><button class="btn btn-ghost btn-icon btn-sm" data-del="${m.id}" title="Hapus" style="color:var(--danger)">${icon('trash')}</button></div></td></tr>`; }).join('')}
        </tbody></table></div>` : emptyState('book', 'Belum ada materi', 'Tambahkan materi pertama untuk subtes ini.', `<button class="btn btn-primary" onclick="$('#addMat').click()">${icon('plus')}Tambah materi</button>`);
      $$('[data-edit]', el).forEach((b) => (b.onclick = () => materialForm(mats.find((m) => m.id === b.dataset.edit), mats)));
      $$('[data-del]', el).forEach((b) => (b.onclick = async () => {
        const m = mats.find((x) => x.id === b.dataset.del);
        if (!(await confirmDialog({ title: 'Hapus materi?', message: `“${esc(m.title)}” beserta progres belajar siswa untuk materi ini akan dihapus.`, confirmText: 'Hapus', ic: 'trash' }))) return;
        try { await db.q(db.from('materials').delete().eq('id', m.id)); await Files.remove(m.file_url).catch(() => {}); toast('success', 'Materi dihapus'); refreshView(); } catch (e) { toast('error', 'Gagal', errMsg(e)); }
      }));
      $$('[data-mv]', el).forEach((b) => (b.onclick = async () => {
        const m = mats.find((x) => x.id === b.dataset.id);

        [group[i], group[j]] = [group[j], group[i]];
        setBusy(b, true);
        try { await Promise.all(group.map((x, k) => (x.sort_order !== k + 1 ? db.q(db.from('materials').update({ sort_order: k + 1 }).eq('id', x.id)) : null))); refreshView(); }
        catch (e) { toast('error', 'Gagal mengubah urutan', errMsg(e)); setBusy(b, false); }
      }));
    };
    draw();
    $$('[data-s]', el).forEach((b) => (b.onclick = () => { matState.subject = b.dataset.s; $$('#matChips .chip', el).forEach((c) => c.classList.toggle('active', c === b)); draw(); }));
    $('#matQ', el).oninput = debounce((e) => { matState.q = e.target.value; draw(); }, 150);
    $('#addMat', el).onclick = () => materialForm(null, mats);
  },
};

  m ||= { subject_id: matState.subject || '', title: '', summary: '', content: '', video_url: '', file_url: '', file_name: '', sort_order: '', duration_minutes: 0, is_premium: false, is_downloadable: true, is_published: true };
  modal({
    title: isNew ? 'Tambah materi' : 'Edit materi', size: 'wide',
    body: `<form id="matForm" novalidate>
      <div class="grid-2">${F.text('title', 'Judul materi', m.title, { attrs: 'maxlength="200"' })}${F.select('subject_id', 'Mata pelajaran / subtes', subjectOpts(), m.subject_id)}</div>
      ${F.area('summary', 'Ringkasan singkat', m.summary, { rows: 2, attrs: 'maxlength="400"' })}
      ${F.area('content', 'Isi materi (mendukung format sederhana: # judul, **tebal**, *miring*, - daftar)', m.content, { rows: 7 })}
      <div class="grid-2">${F.text('video_url', 'Link video (YouTube / Vimeo / Google Drive / .mp4)', Files.isStorage(m.video_url) ? '' : m.video_url, { ph: 'https://youtu.be/…' })}
        ${F.file('video_file', 'atau unggah file video', 'video/mp4,video/webm', Files.isStorage(m.video_url) ? '✓ Video tersimpan di storage. Unggah baru untuk mengganti.' : 'Maks 50 MB')}</div>
      <div class="grid-2">${F.text('file_link', 'Link modul / PDF', Files.isStorage(m.file_url) ? '' : m.file_url, { ph: 'https://…/modul.pdf' })}
        ${F.file('pdf_file', 'atau unggah PDF / modul', '.pdf,.doc,.docx,.ppt,.pptx', m.file_url && Files.isStorage(m.file_url) ? `✓ ${esc(m.file_name || 'File tersimpan')}. Unggah baru untuk mengganti.` : 'PDF disarankan agar dapat dibaca langsung')}</div>
      <div class="grid-3">${F.text('sort_order', 'Nomor urut', m.sort_order, { type: 'number', attrs: 'min="0"', hint: 'Kosongkan untuk otomatis' })}${F.text('duration_minutes', 'Estimasi durasi (menit)', m.duration_minutes, { type: 'number', attrs: 'min="0"' })}<div></div></div>
      <div class="grid-3">${F.sw('is_published', 'Terbitkan', m.is_published, 'Draft tidak terlihat siswa')}${F.sw('is_premium', 'Materi premium', m.is_premium, 'Hanya akun premium')}${F.sw('is_downloadable', 'Izinkan unduh modul', m.is_downloadable)}</div>
      ${m.file_url ? `<label class="check small"><input type="checkbox" name="remove_file"> Hapus modul/PDF yang terpasang</label>` : ''}
    </form>`,
    actions: [{ label: 'Batal' }, {
      label: isNew ? 'Simpan materi' : 'Simpan perubahan', cls: 'btn-primary', icon: 'check',
      onClick: async ({ root }) => {
        const form = $('#matForm', root);
        const d = validate(form, { title: V.len('Judul', 3, 200), subject_id: V.req('Subtes'), video_url: V.url, file_link: V.url, duration_minutes: V.numOpt('Durasi', 0, 1000), sort_order: V.numOpt('Urutan', 0, 9999) });
        if (!d) return false;
        const row = { title: d.title, subject_id: +d.subject_id, summary: d.summary, content: d.content, duration_minutes: +d.duration_minutes || 0, is_published: d.is_published, is_premium: d.is_premium, is_downloadable: d.is_downloadable };
        row.sort_order = d.sort_order !== '' ? +d.sort_order : (isNew || +d.subject_id !== m.subject_id) ? Math.max(0, ...all.filter((x) => x.subject_id === +d.subject_id).map((x) => x.sort_order)) + 1 : m.sort_order;
        row.video_url = d.video_file ? await Files.upload(d.video_file, 'videos') : d.video_url || (Files.isStorage(m.video_url) ? m.video_url : '');
        if (d.pdf_file) { row.file_url = await Files.upload(d.pdf_file, 'materials'); row.file_name = d.pdf_file.name; }
        else if (d.file_link) { row.file_url = d.file_link; row.file_name = d.file_link.split('/').pop().split('?')[0]; }
        else if (d.remove_file) { row.file_url = ''; row.file_name = ''; }
        else if (!Files.isStorage(m.file_url)) { row.file_url = ''; row.file_name = ''; }
        if (isNew) await db.q(db.from('materials').insert(row)); else await db.q(db.from('materials').update(row).eq('id', m.id));
        if (!isNew && m.file_url && row.file_url !== undefined && row.file_url !== m.file_url) Files.remove(m.file_url).catch(() => {});
        toast('success', isNew ? 'Materi ditambahkan' : 'Materi diperbarui', 'Perubahan langsung terlihat di dashboard siswa.');
        refreshView();
      },
    }],
  });
}

function tryoutState(t) {
  const now = Date.now();
  if (!t.is_published) return ['Draft', 'gray'];
  if (t.start_at && now < new Date(t.start_at)) return ['Terjadwal', 'blue'];
  if (t.end_at && now > new Date(t.end_at)) return ['Berakhir', 'gray'];
  return ['Berlangsung', ''];
}

function importQuestions(toId) {
  let rows = [];
  const check = (r, i) => {
    const e = [];
    if (!r.question_text) e.push('teks soal kosong');
    if (!r.option_a || !r.option_b) e.push('opsi A & B wajib');
    const k = String(r.correct_option || '').toUpperCase();
    if (!/^[A-E]$/.test(k)) e.push('kunci harus A–E'); else if (!r['option_' + k.toLowerCase()]) e.push(`opsi ${k} kosong`);
    if (r.subject_code && !subjectByCode(String(r.subject_code).toUpperCase())) e.push(`kode subtes "${r.subject_code}" tidak dikenal`);
    if (r.weight && !(+r.weight > 0)) e.push('bobot tidak valid');
    return e.length ? `Baris ${i + 1}: ${e.join(', ')}` : '';
  };
  const m = modal({
    title: 'Import soal massal', sub: 'Tempel CSV/JSON atau unggah file. Kolom: <code class="inline">' + IMPORT_COLS.join(', ') + '</code>', size: 'wide',
    body: `<div class="field"><input class="input" type="file" id="impFile" accept=".csv,.json,text/csv,application/json" style="padding:8px"></div>
      <div class="field"><textarea class="input" id="impText" rows="8" placeholder="subject_code,question_text,option_a,option_b,option_c,option_d,option_e,correct_option,weight,explanation,image_url"></textarea></div>
      <div class="small muted mb">Kode subtes: ${S.subjects.map((s) => `<b>${esc(s.code)}</b>`).join(', ')}. Pemisah koma atau titik koma. Import bersifat atomik — jika satu baris gagal, tidak ada yang tersimpan.</div>
      <div id="impPrev"></div>`,
    actions: [{ label: 'Batal' }, { label: 'Pratinjau', cls: 'btn-outline', icon: 'eye', onClick: () => { preview(); return false; } }, {
      label: 'Import sekarang', cls: 'btn-primary', icon: 'upload',
      onClick: async () => {
        preview(); if (!rows.length) { toast('warn', 'Tidak ada data', 'Tempel atau unggah data soal terlebih dahulu.'); return false; }
        const errs = rows.map(check).filter(Boolean); if (errs.length) { toast('error', 'Perbaiki data terlebih dahulu', errs[0]); return false; }
        const payload = rows.map((r) => ({ ...r, correct_option: String(r.correct_option).toUpperCase(), subject_code: String(r.subject_code || '').toUpperCase(), weight: r.weight ? +r.weight : 1 }));
        const n = await db.rpc('admin_import_questions', { p_tryout: toId, p_rows: payload });
        toast('success', `${n} soal berhasil diimport`); refreshView();
      },
    }],
  });
  const parse = (txt) => { txt = txt.trim(); if (!txt) return []; if (txt.startsWith('[')) { const j = JSON.parse(txt); if (!Array.isArray(j)) throw new Error('JSON harus berupa array'); return j; } return CSV.parse(txt); };
  function preview() {
    const box = m.$('#impPrev');
    try {
      rows = parse(m.$('#impText').value);
      const errs = rows.map(check).filter(Boolean);
      box.innerHTML = !rows.length ? '' : `<div class="notice ${errs.length ? 'red' : 'green'} mb">${icon(errs.length ? 'alert' : 'checkCircle')}<div><b>${rows.length} baris terbaca.</b> ${errs.length ? `${errs.length} baris bermasalah:<br>${errs.slice(0, 6).map(esc).join('<br>')}` : 'Semua baris valid.'}</div></div>
        <div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Subtes</th><th>Soal</th><th>Kunci</th><th>Bobot</th></tr></thead><tbody>${rows.slice(0, 5).map((r, i) => `<tr><td>${i + 1}</td><td>${esc(r.subject_code || '–')}</td><td>${esc(String(r.question_text || '').slice(0, 80))}</td><td>${esc(r.correct_option)}</td><td>${esc(r.weight || 1)}</td></tr>`).join('')}</tbody></table></div>${rows.length > 5 ? `<div class="small muted mt-sm">…dan ${rows.length - 5} baris lainnya</div>` : ''}`;
    } catch (e) { rows = []; box.innerHTML = `<div class="notice red">${icon('alert')}<div>Format tidak valid: ${esc(e.message)}</div></div>`; }
  }
  m.$('#impFile').onchange = async (e) => { const f = e.target.files[0]; if (!f) return; m.$('#impText').value = await f.text(); preview(); };
}

const ptnValidate = (r, i) => {
  const e = [];
  if (!r.university || r.university.length < 2) e.push('universitas'); if (!r.program || r.program.length < 2) e.push('program');
  if (!['S1', 'D4', 'D3', 'D2', 'D1'].includes(String(r.level || 'S1').toUpperCase())) e.push('jenjang');
  if (!/^\d+$/.test(String(r.capacity))) e.push('daya tampung'); if (!/^\d+$/.test(String(r.applicants))) e.push('peminat');
  if (!/^\d{4}$/.test(String(r.year))) e.push('tahun'); if (r.reference_score !== '' && r.reference_score != null && isNaN(+r.reference_score)) e.push('skor referensi');
  return e.length ? `Baris ${i + 1}: kolom tidak valid (${e.join(', ')})` : '';
};
function ptnForm(r) {
  const isNew = !r;
  r ||= { university: '', program: '', level: 'S1', capacity: '', applicants: '', year: new Date().getFullYear(), reference_score: '', reference_note: '', source: '' };
  modal({
    title: isNew ? 'Tambah program studi' : 'Edit program studi', size: 'wide',
    body: `<form id="ptnForm" novalidate><div class="grid-2">${F.text('university', 'Nama universitas', r.university)}${F.text('program', 'Program studi', r.program)}</div>
      <div class="grid-3">${F.select('level', 'Jenjang', ['S1', 'D4', 'D3', 'D2', 'D1'].map((l) => [l, l]), r.level)}${F.text('year', 'Tahun data', r.year, { type: 'number' })}${F.text('reference_score', 'Skor referensi (opsional)', r.reference_score ?? '', { type: 'number', attrs: 'step="0.01"' })}</div>
      <div class="grid-3">${F.text('capacity', 'Daya tampung', r.capacity, { type: 'number', attrs: 'min="0"' })}${F.text('applicants', 'Jumlah peminat', r.applicants, { type: 'number', attrs: 'min="0"' })}<div class="field"><label>Tingkat keketatan</label><div class="input" id="compPrev" style="display:flex;align-items:center;background:#F8FCF9">–</div><div class="hint">Dihitung otomatis</div></div></div>
      <div class="grid-2">${F.text('reference_note', 'Keterangan skor referensi', r.reference_note, { ph: 'Mis. skala, metode, catatan validitas' })}${F.text('source', 'Sumber data', r.source, { ph: 'Mis. portal resmi SNPMB' })}</div></form>`,
    onOpen: (m) => { const upd = () => { const c = +m.$('[name=capacity]').value, a = +m.$('[name=applicants]').value; m.$('#compPrev').textContent = a > 0 ? `${fmt.pct((c / a) * 100, 2)} · 1 : ${fmt.num(a / Math.max(c, 1), 1)}` : '–'; }; m.$('[name=capacity]').oninput = upd; m.$('[name=applicants]').oninput = upd; upd(); },
    actions: [{ label: 'Batal' }, {
      label: 'Simpan', cls: 'btn-primary', icon: 'check',
      onClick: async ({ root }) => {
        const d = validate($('#ptnForm', root), { university: V.len('Universitas', 2, 150), program: V.len('Program studi', 2, 150), year: V.int('Tahun', 2000, 2100), capacity: V.int('Daya tampung', 0, 100000), applicants: V.int('Peminat', 0, 10000000), reference_score: V.numOpt('Skor referensi', 0, 100000) });
        if (!d) return false;
        const row = { ...d, capacity: +d.capacity, applicants: +d.applicants, year: +d.year, reference_score: d.reference_score === '' ? null : +d.reference_score };
        if (isNew) await db.q(db.from('ptn_programs').insert(row)); else await db.q(db.from('ptn_programs').update(row).eq('id', r.id));
        toast('success', 'Data PTN disimpan'); refreshView();
      },
    }],
  });
}
function ptnImport() {
  let rows = [];
  const m = modal({
    title: 'Import data PTN', sub: 'Data dengan universitas, program, jenjang, dan tahun yang sama akan diperbarui (upsert).', size: 'wide',
    body: `<div class="field"><input class="input" type="file" id="pFile" accept=".csv,text/csv" style="padding:8px"></div><div class="field"><textarea class="input" id="pText" rows="7" placeholder="${PTN_COLS.join(',')}"></textarea></div><div id="pPrev"></div>`,
    actions: [{ label: 'Batal' }, { label: 'Pratinjau', icon: 'eye', onClick: () => { prev(); return false; } }, {
      label: 'Import', cls: 'btn-primary', icon: 'upload',
      onClick: async () => {
        prev(); if (!rows.length) { toast('warn', 'Tidak ada data'); return false; }
        const errs = rows.map(ptnValidate).filter(Boolean); if (errs.length) { toast('error', 'Data tidak valid', errs[0]); return false; }
        const payload = rows.map((r) => ({ university: r.university, program: r.program, level: String(r.level || 'S1').toUpperCase(), capacity: +r.capacity, applicants: +r.applicants, year: +r.year, reference_score: r.reference_score === '' || r.reference_score == null ? null : +r.reference_score, reference_note: r.reference_note || '', source: r.source || '' }));
        for (let i = 0; i < payload.length; i += 500) await db.q(db.from('ptn_programs').upsert(payload.slice(i, i + 500), { onConflict: 'university,program,level,year' }));
        toast('success', `${payload.length} data PTN diimport`); refreshView();
      },
    }],
  });
  function prev() {
    rows = CSV.parse(m.$('#pText').value);
    const errs = rows.map(ptnValidate).filter(Boolean);
    m.$('#pPrev').innerHTML = rows.length ? `<div class="notice ${errs.length ? 'red' : 'green'}">${icon(errs.length ? 'alert' : 'checkCircle')}<div><b>${rows.length} baris terbaca.</b> ${errs.length ? errs.slice(0, 5).map(esc).join('<br>') : 'Semua valid.'}</div></div>` : '';
  }
  m.$('#pFile').onchange = async (e) => { const f = e.target.files[0]; if (f) { m.$('#pText').value = await f.text(); prev(); } };
}

/* Rekomendasi belajar dinamis berbasis hasil TO */
function buildRecommendations(stats, catalog, progress) {
  const doneSet = new Set(progress.filter((p) => p.completed).map((p) => p.material_id));
  if (!stats) {
    const first = catalog.filter((m) => !m.locked && !doneSet.has(m.id)).slice(0, 3);
    return { headline: 'Mulai dengan Try Out diagnostik', text: 'Kerjakan satu Try Out agar sistem dapat memetakan kekuatan dan kelemahan Anda per subtes.', subjects: [], materials: first };
  }
  const ranked = S.subjects.map((s) => ({ s, v: stats.subj[s.code] })).filter((x) => x.v != null).sort((a, b) => a.v - b.v);
  const weak = ranked.filter((x) => x.v < S.settings.mastery_good).slice(0, 3);
  const focus = weak.length ? weak : ranked.slice(0, 2);
  const mats = [];
  focus.forEach((f) => catalog.filter((m) => m.subject_id === f.s.id && !m.locked && !doneSet.has(m.id)).slice(0, 2).forEach((m) => mats.push({ ...m, reason: `${f.s.code} ${fmt.pct(f.v, 0)}` })));
  return {
    headline: weak.length ? `Fokus pada ${weak.map((w) => w.s.code).join(', ')}` : 'Pertahankan performa Anda',
    text: weak.length ? `Rata-rata subtes ${weak.map((w) => `${w.s.name} (${fmt.pct(w.v, 0)})`).join(', ')} masih di bawah ${S.settings.mastery_good}%. Pelajari materi berikut lalu ulangi latihan.` : 'Semua subtes sudah di atas ambang. Tingkatkan konsistensi dengan Try Out berkala dan materi pendalaman.',
    subjects: focus, materials: mats.slice(0, 4),
  };
}

    if (!ctx.refresh) el.innerHTML = skeleton(1, 160);
    const id = ctx.params.id;
    const [m, catalog, progress] = await Promise.all([
      db.q(db.from('materials').select('*').eq('id', id).maybeSingle()),
      db.rpc('material_catalog'),
      isAdmin() ? Promise.resolve([]) : ST.progress(),
    ]);
    const meta = catalog.find((x) => x.id === id);
    if (!m) {
      el.innerHTML = `<div class="card">${meta?.locked ? emptyState('lock', 'Materi premium', 'Materi ini khusus akun premium. Hubungi administrator untuk meningkatkan akses Anda.', '<a class="btn btn-primary" href="#/learn">Kembali ke Learning Center</a>') : emptyState('alert', 'Materi tidak ditemukan', 'Materi mungkin sudah dihapus atau belum diterbitkan.', '<a class="btn btn-primary" href="#/learn">Kembali</a>')}</div>`;
      return;
    }
    if (!isAdmin() && !ctx.refresh) {
      db.q(db.from('material_progress').upsert({ user_id: S.user.id, material_id: id, last_opened_at: new Date().toISOString() }, { onConflict: 'user_id,material_id' })).catch(() => {});
      if (S.profile.last_material_id !== id) { S.profile.last_material_id = id; db.q(db.from('profiles').update({ last_material_id: id }).eq('id', S.user.id)).catch(() => {}); }
    }
    const prog = progress.find((p) => p.material_id === id), isDone = !!prog?.completed;
    const subj = subjectById(m.subject_id), siblings = catalog.filter((x) => x.subject_id === m.subject_id), idx = siblings.findIndex((x) => x.id === id);
    const doneSet = new Set(progress.filter((p) => p.completed).map((p) => p.material_id));
    let videoSigned = '', fileUrl = '', dlUrl = '';
    try {
      if (Files.isStorage(m.video_url)) videoSigned = await Files.url(m.video_url);
      if (m.file_url) { fileUrl = await Files.url(m.file_url); if (m.is_downloadable) dlUrl = Files.isStorage(m.file_url) ? await Files.url(m.file_url, { download: true, name: m.file_name }) : m.file_url; }
    } catch (e) { toast('warn', 'File tidak dapat dimuat', errMsg(e)); }
    const isPdf = /\.pdf(\?|$)/i.test(m.file_name || m.file_url);
    el.innerHTML = `<a href="#/learn" class="small bold">← Learning Center</a>
      <div class="grid mt" style="grid-template-columns:minmax(0,1fr) 320px;gap:18px" id="matGrid">
        <div class="stack" style="gap:18px">
          <div class="card"><div class="row">${subjBadge(subj?.code)}${m.is_premium ? '<span class="badge violet">★ Premium</span>' : ''}${m.duration_minutes ? `<span class="badge gray">${icon('clock')}${m.duration_minutes} menit</span>` : ''}${isDone ? '<span class="badge">✓ Selesai</span>' : ''}${!m.is_published ? '<span class="badge gray">Draft (pratinjau admin)</span>' : ''}</div>
            <h2 class="mt-sm" style="font-size:24px">${esc(m.title)}</h2>${m.summary ? `<p class="muted mt-sm">${esc(m.summary)}</p>` : ''}</div>
          ${m.video_url ? `<div class="card">${videoEmbed(m.video_url, videoSigned)}</div>` : ''}
          ${m.content ? `<div class="card prose">${renderMarkdown(m.content)}</div>` : ''}
          ${m.file_url ? `<div class="card"><div class="card-head"><div class="row"><div class="li-ico" style="width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--primary)">${icon('file')}</div><div><h3>Modul pembelajaran</h3><p>${esc(m.file_name || 'Dokumen')}</p></div></div>
              <div class="row">${fileUrl ? `<a class="btn btn-outline btn-sm" href="${esc(fileUrl)}" target="_blank" rel="noopener">${icon('eye')}Buka</a>` : ''}${dlUrl ? `<a class="btn btn-primary btn-sm" href="${esc(dlUrl)}" ${Files.isStorage(m.file_url) ? '' : 'target="_blank" rel="noopener"'} download>${icon('download')}Unduh</a>` : '<span class="badge gray">Unduhan dinonaktifkan</span>'}</div></div>
            ${isPdf && fileUrl ? `<iframe class="pdf-frame" src="${esc(fileUrl)}#toolbar=${m.is_downloadable ? 1 : 0}" title="Modul PDF"></iframe>` : ''}</div>` : ''}
          ${!m.video_url && !m.content && !m.file_url ? `<div class="card">${emptyState('file', 'Konten belum tersedia')}</div>` : ''}
        </div>
        <div class="side-sticky stack" style="gap:18px">
          ${!isAdmin() ? `<div class="card"><button class="btn ${isDone ? 'btn-outline' : 'btn-primary'} btn-block btn-lg" id="doneBtn">${icon(isDone ? 'refresh' : 'checkCircle')}${isDone ? 'Tandai belum selesai' : 'Tandai selesai'}</button>
            <div class="row mt-sm">${idx > 0 ? `<a class="btn btn-ghost btn-sm" style="flex:1" href="#/material/${siblings[idx - 1].id}">${icon('left')}Sebelumnya</a>` : '<span style="flex:1"></span>'}${idx < siblings.length - 1 ? `<a class="btn btn-ghost btn-sm" style="flex:1" href="#/material/${siblings[idx + 1].id}">Berikutnya${icon('right')}</a>` : ''}</div></div>` : ''}
          <div class="card"><div class="card-head"><h3>${esc(subj?.name || 'Materi')}</h3><span class="small muted">${siblings.filter((x) => doneSet.has(x.id)).length}/${siblings.length}</span></div>
            <div class="stack" style="gap:4px;max-height:420px;overflow:auto">${siblings.map((x, i) => `<a class="list-item" href="${x.locked ? '#/learn' : '#/material/' + x.id}" style="color:inherit;text-decoration:none;${x.id === id ? 'background:var(--soft)' : ''}"><div class="mc-num" style="width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:700;${doneSet.has(x.id) ? 'background:var(--primary);color:#fff' : 'background:#EEF2F0'}">${doneSet.has(x.id) ? '✓' : x.locked ? icon('lock') : i + 1}</div><div class="li-body"><b style="font-size:13px">${esc(x.title)}</b></div></a>`).join('')}</div></div>
        </div></div>`;
    if (window.innerWidth < 1024) $('#matGrid', el).style.gridTemplateColumns = '1fr';
    const db_ = $('#doneBtn', el);
    if (db_) db_.onclick = async () => {
      setBusy(db_, true);
      try {
        await db.q(db.from('material_progress').upsert({ user_id: S.user.id, material_id: id, completed: !isDone, completed_at: !isDone ? new Date().toISOString() : null, last_opened_at: new Date().toISOString() }, { onConflict: 'user_id,material_id' }));
        toast('success', isDone ? 'Ditandai belum selesai' : 'Materi selesai! 🎉', isDone ? '' : 'Progres belajar Anda tersimpan.');
        if (!isDone && idx < siblings.length - 1 && !siblings[idx + 1].locked) { await sleep(400); return go('/material/' + siblings[idx + 1].id); }
        refreshView();
      } catch (e) { toast('error', 'Gagal menyimpan progres', errMsg(e)); setBusy(db_, false); }
    };
  },
};

/* ============================ DAFTAR TRY OUT ============================ */
function toAvailability(t) {
  const now = Date.now();
  if (t.locked) return { k: 'locked', label: 'Khusus premium', cls: 'violet', btn: `<button class="btn btn-outline btn-block" disabled>${icon('lock')}Khusus premium</button>` };
  if (t.in_progress) return { k: 'resume', label: 'Sedang dikerjakan', cls: 'amber', btn: `<button class="btn btn-primary btn-block" data-resume="${t.in_progress}">${icon('play')}Lanjutkan ujian</button>` };
  if (t.start_at && now < new Date(t.start_at)) return { k: 'soon', label: 'Belum dimulai', cls: 'blue', btn: `<button class="btn btn-outline btn-block" disabled>${icon('clock')}Dibuka ${fmt.dt(t.start_at)}</button>` };
  if (t.end_at && now > new Date(t.end_at)) return { k: 'ended', label: 'Berakhir', cls: 'gray', btn: t.my_attempts ? `<a class="btn btn-outline btn-block" href="#/history">${icon('eye')}Lihat hasil</a>` : `<button class="btn btn-outline btn-block" disabled>Periode berakhir</button>` };
  if (!t.question_count) return { k: 'empty', label: 'Segera hadir', cls: 'gray', btn: `<button class="btn btn-outline btn-block" disabled>Soal belum tersedia</button>` };
  const can = t.my_attempts === 0 || (t.allow_retake && (!t.max_attempts || t.my_attempts < t.max_attempts));
  if (!can) return { k: 'done', label: 'Sudah dikerjakan', cls: '', btn: `<a class="btn btn-outline btn-block" href="#/history">${icon('eye')}Lihat hasil</a>` };
  return { k: 'open', label: t.my_attempts ? 'Bisa diulang' : 'Tersedia', cls: '', btn: `<button class="btn btn-primary btn-block" data-start="${t.id}">${icon('play')}${t.my_attempts ? 'Kerjakan ulang' : 'Mulai Try Out'}</button>` };
}

            <div><div class="small muted">Salah</div><div class="big-num" style="color:var(--danger)">${a.wrong_count}</div></div>
            <div><div class="small muted">Tidak dijawab</div><div class="big-num" style="color:var(--muted)">${a.blank_count}</div></div>
            <div><div class="small muted">Akurasi</div><div class="big-num">${fmt.pct(acc, 0)}</div></div></div>
          <div class="row small muted mt" style="gap:18px"><span>${icon('target', '')} Ketepatan dari soal dijawab: <b>${fmt.pct(answered ? (a.correct_count / answered) * 100 : 0, 0)}</b></span><span>${icon('clock', '')} Waktu pengerjaan: <b>${dur} menit</b></span><span>${icon('check', '')} Selesai ${fmt.dt(a.submitted_at)}</span></div>
          <div class="mt"><h3 style="font-size:15px" class="mb">Analisis skor per subtes</h3><div id="chSub"></div></div></div>
      </div>
      <div class="card mt"><div class="card-head"><h3>Rincian per subtes</h3></div>
        <div class="table-wrap"><table class="table"><thead><tr><th>Subtes</th><th class="num">Soal</th><th class="num">Benar</th><th class="num">Salah</th><th class="num">Kosong</th><th style="min-width:180px">Skor subtes</th><th>Kategori</th></tr></thead><tbody>
        ${subs.map((s) => `<tr><td>${subjBadge(s.code)} ${esc(s.name)}</td><td class="num">${s.total}</td><td class="num">${s.correct}</td><td class="num">${s.wrong}</td><td class="num">${s.blank}</td><td><div class="row" style="gap:8px;flex-wrap:nowrap"><div style="flex:1">${progressBar(s.percent)}</div><b class="small">${fmt.pct(s.percent, 0)}</b></div></td><td><span class="badge ${masteryCategory(s.percent).cls}">${masteryCategory(s.percent).label}</span></td></tr>`).join('')}</tbody></table></div>

      <div class="card mt" id="reviewBox"><div class="card-head"><div><h3>Pembahasan soal</h3><p>${t?.show_explanation || isAdmin() ? 'Tinjau jawaban dan pembahasan setiap soal' : 'Pembahasan untuk Try Out ini tidak dibuka oleh administrator'}</p></div>
        ${t?.show_explanation || isAdmin() ? `<button class="btn btn-primary" id="revBtn">${icon('bookOpen')}Tampilkan pembahasan</button>` : ''}</div><div id="revList"></div></div>`;
    Charts.bar($('#chSub', el), { labels: subs.map((s) => s.code), data: subs.map((s) => Number(s.percent)), colors: subs.map((s) => subjColor(s.code)), max: 100, suffix: '%', height: 200 });
    const rb = $('#revBtn', el);
    if (rb) rb.onclick = async () => {
      setBusy(rb, true);
      try { const r = await db.rpc('attempt_review', { p_attempt: a.id }); rb.remove(); renderReview($('#revList', el), r.questions); }
      catch (e) { toast('error', 'Pembahasan tidak tersedia', errMsg(e)); setBusy(rb, false); }

};
async function renderReview(box, qs) {
  const imgs = await Files.urls(qs.map((q) => q.image_url)).catch(() => ({}));
  let filter = 'all';
  const draw = () => {
    const st = (q) => (!q.answer ? 'blank' : q.answer === q.correct ? 'right' : 'wrong');
    const list = qs.map((q, i) => ({ ...q, no: i + 1, st: st(q) })).filter((q) => filter === 'all' || q.st === filter);
    box.innerHTML = `<div class="tabs mb">${[['all', 'Semua', qs.length], ['right', 'Benar', qs.filter((q) => st(q) === 'right').length], ['wrong', 'Salah', qs.filter((q) => st(q) === 'wrong').length], ['blank', 'Kosong', qs.filter((q) => st(q) === 'blank').length]].map(([k, l, n]) => `<button data-f="${k}" class="${filter === k ? 'active' : ''}">${l} (${n})</button>`).join('')}</div>
      <div class="stack" style="gap:14px">${list.map((q) => `<div class="card" style="border-left:4px solid ${q.st === 'right' ? 'var(--primary)' : q.st === 'wrong' ? 'var(--danger)' : '#CBD5D1'}">
        <div class="q-meta"><b>Soal ${q.no}</b>${subjBadge(q.subject_code)}${q.st === 'right' ? '<span class="badge">✓ Benar</span>' : q.st === 'wrong' ? '<span class="badge red">✗ Salah</span>' : '<span class="badge gray">Tidak dijawab</span>'}</div>
        <div class="q-text">${esc(q.question_text)}</div>${q.image_url ? `<img class="q-img" src="${esc(imgs[q.image_url] || q.image_url)}" alt="Ilustrasi soal">` : ''}
        ${['A', 'B', 'C', 'D', 'E'].filter((o) => q.options[o]).map((o) => `<button class="opt ${o === q.correct ? 'correct' : o === q.answer ? 'wrong' : ''}" disabled><span class="letter">${o}</span><span>${esc(q.options[o])}${o === q.correct ? ' <b class="small" style="color:var(--primary)">· Kunci</b>' : o === q.answer ? ' <b class="small" style="color:var(--danger)">· Jawaban Anda</b>' : ''}</span></button>`).join('')}
        ${q.explanation ? `<div class="notice green mt-sm">${icon('bookOpen')}<div><b>Pembahasan:</b><div class="prose small mt-sm" style="font-size:14px">${renderMarkdown(q.explanation)}</div></div></div>` : ''}</div>`).join('') || emptyState('check', 'Tidak ada soal pada filter ini')}</div>`;
    $$('[data-f]', box).forEach((b) => (b.onclick = () => { filter = b.dataset.f; draw(); }));
  };
  draw();
}

        <div class="card"><div class="card-head"><h3>${icon('alert', '')} Kelemahan akademik</h3></div>${weaknesses.length ? weaknesses.map((r) => `<div class="list-item"><div class="subject-ico" style="background:${r.s.color};width:38px;height:38px;border-radius:11px;font-size:11.5px">${esc(r.s.code)}</div><div class="li-body"><b>${esc(r.s.name)}</b><span>Rata-rata ${fmt.pct(r.avg, 0)}</span></div><a class="btn btn-soft btn-sm" href="#/learn" onclick="lcState.subject='${r.s.id}'">Pelajari</a></div>`).join('') : `<p class="small muted">Tidak ada subtes di bawah ${S.settings.mastery_weak}%. Hebat!</p>`}</div>

        ${rows.map((r) => `<tr><td>${subjBadge(r.s.code)} ${esc(r.s.name)}</td><td class="num">${r.n}×</td><td>${r.avg == null ? '<span class="muted small">Belum ada data</span>' : `<div class="row" style="gap:8px;flex-wrap:nowrap"><div style="flex:1">${progressBar(r.avg)}</div><b class="small">${fmt.pct(r.avg, 0)}</b></div>`}</td><td class="num">${fmt.pct(r.last, 0)}</td>
          <td>${r.prev == null ? '–' : r.last > r.prev ? `<span class="badge">▲ ${fmt.num(r.last - r.prev, 1)}</span>` : r.last < r.prev ? `<span class="badge red">▼ ${fmt.num(r.prev - r.last, 1)}</span>` : '<span class="badge gray">Stabil</span>'}</td><td><span class="badge ${masteryCategory(r.avg).cls}">${masteryCategory(r.avg).label}</span></td></tr>`).join('')}</tbody></table></div></div>`;

    };
    drawLine();

      const labels = list.map((r) => `${r.program.slice(0, 14)} · ${r.university.split(' ').map((w) => w[0]).join('').slice(0, 5)}`);

  },
};

Views.exam = {
  noRefresh: true,
  async render(el, ctx) {
    const id = ctx.params.id, key = 'keepstudy.exam.' + id;
    el.innerHTML = `<div class="page-loader"><div class="spinner"></div><div class="muted">Menyiapkan lembar ujian…</div></div>`;
    const data = await db.rpc('get_attempt', { p_attempt: id });
    if (data.status === 'SUBMITTED') { localStorage.removeItem(key); toast('info', 'Ujian sudah selesai', 'Menampilkan hasil Anda.'); return replaceRoute('/result/' + id); }
    const qs = data.questions || [];
    if (!qs.length) { el.innerHTML = `<div class="setup"><div class="card">${emptyState('alert', 'Soal tidak tersedia', 'Hubungi administrator.', '<a class="btn btn-primary" href="#/tryout">Kembali</a>')}</div></div>`; return; }
    const offset = new Date(data.server_now).getTime() - Date.now();
    const deadline = new Date(data.deadline_at).getTime();
    const st = { i: 0, answers: { ...(data.answers || {}) }, flags: new Set(data.flags || []), ver: 0, savedVer: 0, saving: false, offline: false, done: false, warned: {} };

    /* Cadangan lokal (hanya cache saat koneksi terputus — sumber kebenaran tetap server) */
    try {
      const b = JSON.parse(localStorage.getItem(key) || 'null');
      if (b && b.unsynced && (!data.last_saved_at || b.t > new Date(data.last_saved_at).getTime())) {
        Object.entries(b.answers || {}).forEach(([q, v]) => { if (qs.some((x) => x.id === q)) st.answers[q] = v; });
        (b.flags || []).forEach((f) => st.flags.add(f)); st.ver = 1;
        toast('info', 'Jawaban dipulihkan', 'Jawaban yang belum tersinkron berhasil dipulihkan dari perangkat ini.');
      }
      if (typeof b?.i === 'number') st.i = clamp(b.i, 0, qs.length - 1);
    } catch (_) {}
    const backup = () => { try { localStorage.setItem(key, JSON.stringify({ answers: st.answers, flags: [...st.flags], i: st.i, t: Date.now(), unsynced: st.ver !== st.savedVer })); } catch (_) {} };
    const imgs = await Files.urls(qs.map((q) => q.image_url)).catch(() => ({}));
    const groups = []; qs.forEach((q, i) => { const g = groups.at(-1); if (g && g.code === q.subject_code) g.idx.push(i); else groups.push({ code: q.subject_code, name: q.subject_name, idx: [i] }); });

    el.innerHTML = `<div class="exam">
      <header class="exam-top">
        <div class="brand-mark hide-sm">${icon('logo')}</div>
        <h2>${esc(data.title)}</h2>
        <div class="save-state hide-sm" id="saveState"><i></i><span>Tersimpan</span></div>
        <div class="timer" id="timer" role="timer" aria-live="off">${icon('clock')}<span id="timerTxt">--:--</span></div>
        <button class="btn btn-danger btn-sm" id="finishTop">${icon('send')}<span class="hide-sm">Akhiri ujian</span></button>
      </header>
      <div class="exam-body">
        <main><div class="card q-card" id="qCard"></div>
          <div class="small muted mt-sm hide-sm">Pintasan: <b>A–E</b> pilih jawaban · <b>←/→</b> pindah soal · <b>R</b> ragu-ragu</div></main>
        <aside class="side-sticky"><div class="card">
          <div class="row between"><b>Navigasi soal</b><span class="small muted" id="ansCount"></span></div>
          <div class="mt-sm" id="ansBar"></div>
          <div class="legend"><span><i style="background:var(--primary);border-color:var(--primary)"></i>Dijawab</span><span><i></i>Belum dijawab</span><span><i style="background:var(--warn-soft);border-color:#f59e0b"></i>Ragu-ragu</span><span><i style="box-shadow:0 0 0 2px var(--text)"></i>Soal aktif</span></div>
          <div id="numGrid" class="stack" style="gap:12px;max-height:52vh;overflow:auto;padding:4px 2px"></div>
          <button class="btn btn-danger btn-block mt" id="finishSide">${icon('send')}Akhiri ujian</button>
          <div class="save-state mt-sm" id="saveState2" style="justify-content:center"><i></i><span>Tersimpan</span></div>
        </div></aside>
      </div></div>`;

    const drawNav = () => {
      const answered = Object.keys(st.answers).length;
      $('#ansCount').textContent = `${answered}/${qs.length} dijawab`;
      $('#ansBar').innerHTML = progressBar((answered / qs.length) * 100);
      $('#numGrid').innerHTML = groups.map((g) => `<div><div class="tiny muted bold mb" style="margin-bottom:6px">${esc(g.code)} · ${esc(g.name)}</div><div class="num-grid">${g.idx.map((i) => { const q = qs[i]; return `<button class="qnum ${st.answers[q.id] ? 'answered' : ''} ${st.flags.has(q.id) ? 'flagged' : ''} ${i === st.i ? 'current' : ''}" data-n="${i}" aria-label="Soal ${i + 1}">${i + 1}</button>`; }).join('')}</div></div>`).join('');
      $$('#numGrid [data-n]').forEach((b) => (b.onclick = () => goto(+b.dataset.n)));
    };
    const drawQ = () => {
      const q = qs[st.i], ans = st.answers[q.id], fl = st.flags.has(q.id);
      $('#qCard').innerHTML = `<div class="q-meta"><span class="badge gray">Soal ${st.i + 1} dari ${qs.length}</span>${subjBadge(q.subject_code)}<span class="small muted">${esc(q.subject_name)}</span>${fl ? `<span class="badge amber">${icon('flag')}Ragu-ragu</span>` : ''}</div>
        <div class="q-text">${esc(q.question_text)}</div>
        ${q.image_url ? `<img class="q-img" src="${esc(imgs[q.image_url] || q.image_url)}" alt="Ilustrasi soal ${st.i + 1}">` : ''}
        <div role="radiogroup" aria-label="Pilihan jawaban">${['A', 'B', 'C', 'D', 'E'].filter((o) => q.options[o]).map((o) => `<button class="opt ${ans === o ? 'selected' : ''}" data-o="${o}" role="radio" aria-checked="${ans === o}"><span class="letter">${o}</span><span>${esc(q.options[o])}</span></button>`).join('')}</div>
        <div class="q-nav">
          <button class="btn btn-outline" id="prevQ" ${st.i === 0 ? 'disabled' : ''}>${icon('left')}Sebelumnya</button>
          <div class="row"><button class="btn ${fl ? 'btn-warn-soft' : 'btn-ghost'}" id="flagQ">${icon('flag')}${fl ? 'Batal ragu-ragu' : 'Ragu-ragu'}</button>${ans ? `<button class="btn btn-ghost" id="clearQ">${icon('x')}Kosongkan</button>` : ''}</div>
          ${st.i < qs.length - 1 ? `<button class="btn btn-primary" id="nextQ">Berikutnya${icon('right')}</button>` : `<button class="btn btn-primary" id="lastQ">${icon('send')}Selesai</button>`}
        </div>`;
      $$('#qCard [data-o]').forEach((b) => (b.onclick = () => choose(b.dataset.o)));
      $('#prevQ').onclick = () => goto(st.i - 1);
      $('#flagQ').onclick = toggleFlag;
      const c = $('#clearQ'); if (c) c.onclick = () => { delete st.answers[q.id]; changed(); };
      const n = $('#nextQ'); if (n) n.onclick = () => goto(st.i + 1);
      const l = $('#lastQ'); if (l) l.onclick = confirmFinish;
    };
    const goto = (i) => { st.i = clamp(i, 0, qs.length - 1); drawQ(); drawNav(); backup(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    const choose = (o) => { st.answers[qs[st.i].id] = o; changed(); };
    const toggleFlag = () => { const id = qs[st.i].id; st.flags.has(id) ? st.flags.delete(id) : st.flags.add(id); changed(); };
    const changed = () => { st.ver++; drawQ(); drawNav(); backup(); setSave(); saveSoon(); };

    const setSave = () => {
      const s = st.offline ? ['offline', 'Offline — tersimpan di perangkat'] : st.saving ? ['saving', 'Menyimpan…'] : st.ver !== st.savedVer ? ['saving', 'Belum tersimpan'] : ['', st.lastSaved ? `Tersimpan ${fmt.time(st.lastSaved)}` : 'Tersimpan'];
      ['#saveState', '#saveState2'].forEach((sel) => { const n = $(sel); if (n) { n.className = `save-state ${s[0]} ${sel === '#saveState' ? 'hide-sm' : 'mt-sm'}`; n.querySelector('span').textContent = s[1]; } });
    };
    const save = async () => {
      if (st.done || st.saving || st.ver === st.savedVer) return;
      st.saving = true; setSave(); const v = st.ver;
      try {
        const r = await db.rpc('save_answers', { p_attempt: id, p_answers: st.answers, p_flags: [...st.flags] });
        if (r.status === 'SUBMITTED') { st.done = true; cleanup(); localStorage.removeItem(key); toast('warn', 'Waktu ujian telah habis', 'Ujian diselesaikan otomatis oleh server.'); return replaceRoute('/result/' + id); }
        st.savedVer = v; st.offline = false; st.lastSaved = new Date(); backup();
      } catch (e) { st.offline = true; backup(); }
      finally { st.saving = false; setSave(); if (st.ver !== st.savedVer && !st.offline) saveSoon(); }
    };
    const saveSoon = debounce(save, 1500);
    const autosave = setInterval(save, KEEPSTUDY_CONFIG.AUTOSAVE_MS);

    const remaining = () => deadline - (Date.now() + offset);
    const tick = () => {
      const r = remaining(), t = $('#timer'); if (!t) return;
      $('#timerTxt').textContent = fmt.clock(r);
      t.classList.toggle('warn', r <= 10 * 60e3 && r > 5 * 60e3); t.classList.toggle('danger', r <= 5 * 60e3);
      [[10, 'Sisa waktu 10 menit'], [5, 'Sisa waktu 5 menit'], [1, 'Sisa waktu 1 menit!']].forEach(([m, msg]) => { if (r <= m * 60e3 && r > (m * 60e3) - 3000 && !st.warned[m]) { st.warned[m] = 1; toast('warn', msg, 'Periksa kembali jawaban Anda.'); } });
      if (r <= 0 && !st.done) finish(true);
    };
    const timer = setInterval(tick, 500);

    const finish = async (auto) => {
      if (st.done) return; st.done = true;
      const ov = modal({ title: auto ? 'Waktu habis' : 'Menyelesaikan ujian', dismissable: false, body: `<div class="center" style="padding:16px 0"><div class="spinner" style="margin:0 auto 14px"></div><p class="muted" id="finMsg">${auto ? 'Waktu pengerjaan berakhir. Jawaban Anda sedang dikirim dan dinilai oleh server…' : 'Mengirim jawaban dan menghitung skor di server…'}</p></div>` });
      for (let attempt = 0; ; attempt++) {
        try {
          await db.rpc('submit_attempt', { p_attempt: id, p_answers: st.answers, p_flags: [...st.flags] });
          cleanup(); localStorage.removeItem(key); ov.close();
          toast('success', 'Ujian selesai', 'Skor Anda telah dihitung.'); return replaceRoute('/result/' + id);
        } catch (e) {
          if (!auto) { st.done = false; ov.close(); toast('error', 'Gagal mengakhiri ujian', errMsg(e)); return; }
          const m = $('#finMsg'); if (m) m.innerHTML = `Koneksi bermasalah, mencoba lagi… (${attempt + 1})<br><span class="small">Tenang — server tetap menilai jawaban yang sudah tersimpan saat waktu habis.</span>`;
          await sleep(4000);
          if (attempt > 30) { ov.close(); return replaceRoute('/history'); }
        }
      }
    };
    const confirmFinish = () => {
      const answered = Object.keys(st.answers).length, blank = qs.length - answered, flagged = [...st.flags].length;
      modal({
        title: 'Akhiri ujian sekarang?', sub: `Sisa waktu ${fmt.clock(remaining())}`, headIcon: `<div class="confirm-ico amber">${icon('alert')}</div>`,
        body: `<div class="kv mb"><div><span>Dijawab</span><b style="color:var(--primary)">${answered}</b></div><div><span>Belum dijawab</span><b style="color:${blank ? 'var(--danger)' : 'inherit'}">${blank}</b></div><div><span>Ragu-ragu</span><b style="color:${flagged ? 'var(--warn)' : 'inherit'}">${flagged}</b></div><div><span>Total soal</span><b>${qs.length}</b></div></div>
          ${blank || flagged ? `<div class="notice warn">${icon('alert')}<div>Masih ada ${blank ? `<b>${blank} soal belum dijawab</b>` : ''}${blank && flagged ? ' dan ' : ''}${flagged ? `<b>${flagged} soal ragu-ragu</b>` : ''}. Jawaban tidak dapat diubah setelah ujian diakhiri.</div></div>` : `<div class="notice green">${icon('checkCircle')}<div>Semua soal sudah dijawab. Jawaban tidak dapat diubah setelah ujian diakhiri.</div></div>`}`,
        actions: [{ label: 'Kembali mengerjakan' }, { label: 'Ya, akhiri ujian', cls: 'btn-danger', icon: 'send', onClick: () => { setTimeout(() => finish(false), 260); } }],
      });
    };
    $('#finishTop').onclick = confirmFinish; $('#finishSide').onclick = confirmFinish;

    const onKey = (e) => {
      if (document.querySelector('.modal-root') || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) return;
      const k = e.key.toUpperCase();
      if (/^[A-E]$/.test(k) && qs[st.i].options[k]) { e.preventDefault(); choose(k); }
      else if (e.key === 'ArrowRight') goto(st.i + 1); else if (e.key === 'ArrowLeft') goto(st.i - 1); else if (k === 'R') toggleFlag();
    };
    const onUnload = (e) => { if (!st.done) { backup(); e.preventDefault(); e.returnValue = ''; } };
    const onVis = () => { if (document.visibilityState === 'hidden') save(); };
    const onOnline = () => { st.offline = false; setSave(); save(); toast('success', 'Koneksi kembali', 'Jawaban disinkronkan ke server.'); };
    const onOffline = () => { st.offline = true; setSave(); toast('warn', 'Koneksi terputus', 'Lanjutkan mengerjakan — jawaban disimpan di perangkat dan disinkronkan otomatis.'); };
    document.addEventListener('keydown', onKey); window.addEventListener('beforeunload', onUnload); document.addEventListener('visibilitychange', onVis);
    window.addEventListener('online', onOnline); window.addEventListener('offline', onOffline);
    const cleanup = () => {
      clearInterval(timer); clearInterval(autosave);
      document.removeEventListener('keydown', onKey); window.removeEventListener('beforeunload', onUnload); document.removeEventListener('visibilitychange', onVis);
      window.removeEventListener('online', onOnline); window.removeEventListener('offline', onOffline);
    };
    onLeave(() => { if (!st.done) { save(); toast('info', 'Ujian masih berjalan', 'Timer tetap berjalan di server. Lanjutkan dari menu Try Out.'); } cleanup(); });

    drawQ(); drawNav(); setSave(); tick();
    if (st.ver) save();
  },
};

];

/* ============================ BOOT ============================ */
async function handleAuthEvent(event, session) {
  if (!S.booted) return;
  try {
    if (event === 'PASSWORD_RECOVERY') { S.recovery = true; await setSession(session); $('#app').innerHTML = ''; return replaceRoute('/reset'); }
    if (event === 'SIGNED_IN' && session?.user?.id !== S.user?.id) { await setSession(session); $('#app').innerHTML = ''; return render(); }
    if (event === 'SIGNED_OUT' && S.user) { stopRealtime(); S.session = S.user = S.profile = null; $('#app').innerHTML = ''; return replaceRoute('/login'); }
    if ((event === 'TOKEN_REFRESHED' || event === 'USER_UPDATED') && session) { S.session = session; S.user = session.user; }
  } catch (e) { toast('error', 'Sesi bermasalah', errMsg(e)); }
}

async function boot() {
  const cfg = getConfig();
  if (!cfg) return renderSetup();
  if (!window.supabase?.createClient) return renderFatal('Library Supabase gagal dimuat', 'Periksa koneksi internet Anda lalu muat ulang halaman. Aplikasi membutuhkan akses ke cdn.jsdelivr.net.');
  S.sb = window.supabase.createClient(cfg.url, cfg.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } });
  if (/type=recovery/.test(location.hash + location.search)) S.recovery = true;
  S.sb.auth.onAuthStateChange((event, session) => { setTimeout(() => handleAuthEvent(event, session), 0); });
  try {
    await loadSettings().catch(() => {});
    const { data, error } = await S.sb.auth.getSession();
    if (error) throw error;
    await setSession(data.session);
  } catch (e) {
    return renderFatal('Gagal terhubung ke backend', `${errMsg(e)} — pastikan URL/anon key benar dan skema SQL sudah dijalankan.`, true);
  }
  if (/access_token=|type=recovery|type=signup|type=magiclink|error_description=/.test(location.hash)) {
    if (/error_description=/.test(location.hash)) toast('error', 'Tautan tidak valid', decodeURIComponent((location.hash.match(/error_description=([^&]+)/) || [])[1] || '').replace(/\+/g, ' '));
    history.replaceState(null, '', location.pathname + '#' + (S.recovery ? '/reset' : '/'));
  }
  S.booted = true;
  window.addEventListener('hashchange', render);
  render();
}
boot();

</script>
</body>
</html>
